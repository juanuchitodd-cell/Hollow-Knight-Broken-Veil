<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hollow Knight: Broken Veil – Menú</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f4f1ea;--dim:#a9a8ae;--bg2:#05060a;--eye:#06180c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#lrw{position:relative;flex:none;width:1920px;height:1080px}
#lrw .stage{transform-origin:0 0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.stage{text-rendering:geometricPrecision}   /* el texto escala parejo aunque sea muy chico */   /* marco que deshace la reducción del escenario: juntos dejan el tamaño final igual, pero el escenario se dibuja con pocos píxeles */
*{box-sizing:border-box;margin:0}
html{background:#000;color-scheme:dark}   /* la zona segura (muesca / barra superior) queda negra, nunca blanca */
html,body{overscroll-behavior:none}
html,body{height:100%;height:100dvh}
html.ext{padding:0}                        /* Sin bordes: la escena ocupa también la parte de arriba (zona segura) */
:fullscreen,:-webkit-full-screen{background:#000}
body{background:var(--bg2);color:var(--ink);font-family:'Cinzel','Trajan Pro',Georgia,serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage{position:relative;flex:none;width:1920px;height:1080px;transform-origin:50% 50%;container-type:size;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
background:#000}
.stage::before{content:"";position:absolute;top:0;left:0;right:0;height:150%;background:var(--ibg,url(./assets/background.webp)) center/100% 100% no-repeat;transform-origin:50% 36%;filter:brightness(1.25) saturate(1.1);animation:breath 4.5s ease-in-out infinite alternate}
@keyframes breath{from{transform:scale(.92);opacity:.5}to{transform:scale(1.1);opacity:1}}
.p{position:absolute;bottom:calc(-1% - var(--E,0px));border-radius:50%;background:#b8ffb8;box-shadow:0 0 8px 2px rgba(70,255,110,.7);opacity:0;animation:fl 10s linear infinite;z-index:1}
@keyframes flx{0%{transform:translate(0,0);opacity:0}15%{opacity:var(--o,.9)}70%{opacity:var(--o,.9)}100%{transform:translate(var(--dx,1cqw),calc(var(--ey,0px)*-1));opacity:0}}   /* partículas de la franja de abajo en Sin bordes: nacen fuera de la pantalla y suben hasta el borde del 16:9 */
@keyframes fl{0%{transform:translate(0,0);opacity:0}12%{opacity:var(--o,.9)}100%{transform:translate(var(--dx,1cqw),calc(var(--r)*-1 - var(--E,0px)));opacity:0}}
.title{position:relative;z-index:2;text-align:center;margin-top:11.7cqh;filter:drop-shadow(0 0 .73cqw rgba(255,255,255,.55))}
.title img{display:block;margin-left:auto;margin-right:auto}
.top{width:15.56cqw}
.bot{width:33.43cqw;margin-top:0.33cqw}
.hk{width:27.16cqw;margin-top:0cqw}
.bv{width:43.32cqw;margin-top:-1.55cqw;position:relative;left:0}
nav{position:relative;z-index:2;margin-top:3.33cqh;display:flex;flex-direction:column;align-items:center;gap:2.88cqh}
.item{display:flex;align-items:center;gap:1.2cqw;cursor:pointer;font-size:1.78cqw;line-height:1;letter-spacing:.06em;color:var(--ink);font-weight:500;text-shadow:0 0 1.1cqw rgba(255,255,255,.55);padding:0;user-select:none}
.item .a{position:relative;width:2.5cqw;aspect-ratio:4/3;margin:-.08cqw 0;display:block;opacity:0}
.item .a .s{position:absolute;inset:0;background:var(--iarrow,url(./assets/arrow-sprite.png)) 0 0/2400% 100% no-repeat}
.item .a:last-child .s{transform:scaleX(-1)}
.item.sel .a{opacity:1}
.item.sel .a .s{animation:arrowPlay .34s steps(23,end) both}
@keyframes arrowPlay{from{background-position:0 0}to{background-position:100% 0}}
.item .a{pointer-events:none;-webkit-user-drag:none}
.cherry{position:absolute;z-index:2;left:9cqw;bottom:7cqh;display:flex;flex-direction:column;align-items:center;gap:.3cqw;font-family:Arial,sans-serif;color:var(--ink)}
.cherry img{width:6cqw;height:auto;display:block}
.cherry i{font-style:normal;font-size:.8cqw;color:var(--dim);letter-spacing:.08em}
.intro{position:absolute;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;animation:introOut 1.8s ease-in-out 18s forwards}
.intro img{width:23cqw;height:auto;display:block;opacity:0;transform-origin:50% 50%;animation:logoIn 5.8s linear .5s forwards}
@keyframes logoIn{0%{opacity:0;transform:scale(1);filter:brightness(1.25) drop-shadow(0 0 1.2cqw rgba(255,255,255,.55))}15%{opacity:1;filter:brightness(1.25) drop-shadow(0 0 1.2cqw rgba(255,255,255,.55))}68%{opacity:1;filter:brightness(1.25) drop-shadow(0 0 1.2cqw rgba(255,255,255,.55))}100%{opacity:0;transform:scale(1.22);filter:brightness(1.25) drop-shadow(0 0 1.2cqw rgba(255,255,255,.55))}}
@keyframes introOut{to{opacity:0}}
/* pantalla de guardado automático: entra después del logo de Team Cherry (1 s), se queda 9 s para poder leerla, se funde a negro (1,2 s) y recién entonces aparece el menú (la intro negra se desvanece a los 18 s) */
.save{position:absolute;inset:0;background:var(--isave,url(./assets/save-screen.jpg)) center/cover no-repeat;opacity:0;animation:saveShow 11.2s linear 6.5s forwards}
@keyframes saveShow{0%{opacity:0;animation-timing-function:ease-in-out}8.93%{opacity:1}89.29%{opacity:1;animation-timing-function:ease-in-out}100%{opacity:0}}

.save .halo{position:absolute;left:50%;top:20.55cqw;width:32cqw;height:32cqw;transform:translate(-50%,-50%);background:var(--ihalo,url(./assets/save-halo.webp)) center/100% 100% no-repeat;pointer-events:none}
.save .sorn{position:absolute;left:0;top:-3.125cqw;width:100cqw;height:62.5cqw;display:block;overflow:visible}
.save .sglow{stroke:#fff;stroke-width:.8;stroke-linejoin:round}
.save .sline{stroke:#fff;stroke-width:1.8;stroke-linejoin:round}
.save .stxt{position:absolute;left:0;right:0;top:34.35cqw;transform:translateY(-50%);text-align:center;font-family:'Perpetua','Cormorant Garamond','EB Garamond',Georgia,serif;font-size:2.02cqw;line-height:3.07cqw;font-weight:400;color:#f4f1ea;text-shadow:0 0 .6cqw rgba(0,0,0,.55)}
.save .stxt span{display:block}
*{-webkit-tap-highlight-color:transparent}
.stage,.stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
.item{touch-action:manipulation;cursor:default}
/* efecto al elegir una opción: medido fotograma a fotograma del video a velocidad real (30 fps); todo dura --fx (8 cuadros) */
.item .tw{position:relative;display:inline-block}
.item .t{position:relative;display:inline-block}
.item .g{position:absolute;inset:0;pointer-events:none}
.item .g::before,.item .g::after{content:"";position:absolute;opacity:0}
.item .g::before{left:-4.2cqw;right:-4.2cqw;top:-70%;bottom:-70%;background:radial-gradient(ellipse closest-side at center,rgba(255,255,255,1) 0%,rgba(255,255,255,.72) 20%,rgba(255,255,255,.34) 50%,rgba(255,255,255,.1) 80%,rgba(255,255,255,0) 100%)}
.item .g::after{left:-3.4cqw;right:-3.4cqw;top:25%;bottom:25%;background:radial-gradient(ellipse closest-side at center,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 35%,rgba(255,255,255,.25) 70%,rgba(255,255,255,0) 100%)}
.item .a{z-index:0}
.item .tw{z-index:1}
.stage.go nav{pointer-events:none}
.stage.go .item.sel .t{animation:selFade var(--fx) linear forwards}
.stage.go .item.sel .g::before{animation:glowOuter var(--fx) linear forwards}
.stage.go .item.sel .g::after{animation:glowInner var(--fx) linear forwards}
.stage.go .item.up{animation:upFade var(--fx) linear forwards}
.stage.go .item.dn,.stage.go .cherry{animation:dnFade var(--fx) linear forwards}
.stage.go .title{animation:titleFade var(--fx) linear forwards}
.stage.go .item.sel .a{animation:hideArrow var(--fx) linear forwards}
.stage.go .item.sel .a .s{animation:arrowPlayRev calc(var(--fx)*.5) steps(23,end) both}
@keyframes arrowPlayRev{from{background-position:100% 0}to{background-position:0 0}}
.stage.back .title,.stage.back nav,.stage.back .cherry{animation:menuBack .5s ease-out both}
@keyframes hideArrow{0%,55%{opacity:1}55.1%,100%{opacity:0}}
@keyframes menuBack{from{opacity:0}to{opacity:1}}
@keyframes titleFade{0%{opacity:1}12.5%{opacity:0.64}25%{opacity:0}37.5%{opacity:0}100%{opacity:0}}
@keyframes upFade{0%{opacity:1}12.5%{opacity:0.67}25%{opacity:0.42}37.5%{opacity:0.1}50%{opacity:0}62.5%{opacity:0}100%{opacity:0}}
@keyframes dnFade{0%{opacity:1}12.5%{opacity:0.8}25%{opacity:0.63}37.5%{opacity:0.33}50%{opacity:0.14}62.5%{opacity:0.07}75%{opacity:0}87.5%{opacity:0}100%{opacity:0}}
@keyframes selFade{0%{opacity:1;filter:brightness(1)}8%{opacity:1;filter:brightness(2.1)}18%{opacity:.96;filter:brightness(1.65)}30%{opacity:.78;filter:brightness(1.3)}45%{opacity:.48;filter:brightness(1.1)}62.5%{opacity:.24;filter:brightness(1)}75%{opacity:.08}87.5%,100%{opacity:0}}
@keyframes glowOuter{0%{opacity:0;transform:scaleY(.08)}15%{opacity:1;transform:scaleY(.35)}35%{opacity:.7;transform:scaleY(.75)}50%{opacity:0;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
@keyframes glowInner{0%{opacity:0;transform:scaleY(.12)}12%{opacity:1;transform:scaleY(.4)}30%{opacity:.6;transform:scaleY(.95)}42%{opacity:0;transform:scaleY(1.35)}100%{opacity:0;transform:scaleY(1.35)}}
.stage.lr img,.stage.lr .item .a .s,.stage.lr .save,.stage.lr .save .halo,.stage.lr::before{image-rendering:pixelated}   /* a resolución baja se ven los píxeles */
.item .val.fixed{opacity:.7}   /* opción con un solo valor (no se puede cambiar): el valor se ve más apagado */
/* ---- confirmación de "Salir del juego" ---- */
#qorn{top:36.6cqh}                                            /* ornamento arriba */
#qtitle{top:42.5cqh;font-size:1.96cqw;text-shadow:0 0 1.1cqw rgba(255,255,255,.55)}   /* la pregunta, debajo del ornamento y del tamaño de las opciones */
#qmenu{top:48.9cqh;gap:3.75cqh}                               /* Sí y No, con el mismo espaciado de las demás opciones */
#qopts .otitle{font-variant-caps:small-caps}
#bye{position:fixed;inset:0;z-index:99;background:#000;opacity:0;pointer-events:all;transition:opacity .7s ease-in}
#bye.on{opacity:1}
.intro::before{content:"";position:absolute;inset:calc(var(--ey,0px)*-1) calc(var(--ex,0px)*-1);background:#000;z-index:-1}   /* en Sin bordes, la pantalla del guardado también tapa en negro las franjas de arriba/abajo y los costados (sin brillo ni partículas) */
/* ---- pantalla de Opciones (medidas tomadas de la captura de referencia) ---- */
.opts{position:absolute;inset:0;z-index:2;display:none}
.opts.show{display:block;animation:optsIn .3s ease-out both}
@keyframes optsIn{from{opacity:0}to{opacity:1}}
.otitle{position:absolute;left:0;right:0;top:13cqh;transform:translateY(-50%);text-align:center;font-size:2.68cqw;line-height:1;letter-spacing:.05em;font-weight:500;color:var(--ink);text-shadow:0 0 1.2cqw rgba(255,255,255,.55)}
.orn{position:absolute;left:50%;top:20.5cqh;width:30cqw;height:auto;transform:translate(-50%,-50%);display:block;--r:0%;filter:drop-shadow(0 0 .7cqw rgba(255,255,255,.45));-webkit-mask-image:linear-gradient(90deg,transparent calc(50% - var(--r) - 6%),#000 calc(50% - var(--r)),#000 calc(50% + var(--r)),transparent calc(50% + var(--r) + 6%));mask-image:linear-gradient(90deg,transparent calc(50% - var(--r) - 6%),#000 calc(50% - var(--r)),#000 calc(50% + var(--r)),transparent calc(50% + var(--r) + 6%))}
.onav{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#omenu{top:26.6cqh;gap:3.75cqh}
#oback{top:85.5cqh}
.stage.opt .title,.stage.opt #menu,.stage.opt .cherry{visibility:hidden}
.stage.go .onav{pointer-events:none}
.stage.go .otitle,.stage.go .orn{animation:titleFade var(--fx) linear forwards}
.stage.back .otitle,.stage.back .orn,.stage.back .onav{animation:menuBack .5s ease-out both}
.opts.out{animation:optsOut .27s linear both}
.opts.show.slow{animation:optsIn .8s ease-out both}
@keyframes optsOut{from{opacity:1}to{opacity:0}}
/* ---- Opciones de juego ---- */
#gmenu{top:26.4cqh;gap:3.5cqh}#greset{top:76.3cqh}#gback{top:85.5cqh}
#gopts .otitle{font-variant-caps:small-caps}
.item.row{width:54cqw}.item.row .tw{flex:1;text-align:left}
.item .val{font-size:1.78cqw;letter-spacing:.06em;text-align:right;text-shadow:0 0 1.1cqw rgba(255,255,255,.55)}
.stage.wide .item .g::before{left:-5cqw;right:-5cqw}
.stage.wide .item .g::after{left:-4cqw;right:-4cqw}
/* ---- Audio ---- */
#amenu{top:26.4cqh;gap:3.5cqh}#areset{top:76.3cqh}#aback{top:85.5cqh}
#aopts .otitle{font-variant-caps:small-caps}
#aopts .item.row{width:53cqw}
.item .sl{position:relative;flex:none;width:11.4cqw;height:1.875cqw;margin-right:2cqw;touch-action:none;cursor:pointer}
.item .sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:.22cqw;margin-top:-.11cqw;background:rgba(255,255,255,.28)}
.item .sl .fl{position:absolute;left:0;top:50%;height:.22cqw;margin-top:-.11cqw;width:calc(var(--v,10)*10%);background:#fff;box-shadow:0 0 .5cqw rgba(255,255,255,.6);pointer-events:none}
.item .sl::after{content:"";position:absolute;left:-.8cqw;right:-.8cqw;top:-1.6cqw;bottom:-.9cqw}
.item .sl .mk{position:absolute;left:calc(var(--v,10)*10%);top:50%;margin-top:-2.05cqw;width:.85cqw;height:.85cqw;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 .3cqw rgba(255,255,255,.7))}
.item .num{width:2.4cqw;flex:none}
/* ---- Vídeo (opciones distintas en PC y en móvil) ---- */
#vmenu{top:27cqh;gap:3.79cqh}#vreset{top:79.8cqh}#vback{top:85.9cqh}
#vopts .otitle{font-variant-caps:small-caps}
#vopts .item.row{position:relative}
#vopts .item.row,#gopts .item.row{width:auto}                      /* la fila se ajusta al contenido: nombre y estado quedan cerca */
#vopts .item.row .tw,#gopts .item.row .tw{flex:none;width:var(--lw,26cqw)}
#vmenu .item.row,#gmenu .item.row{align-self:center}              /* todas las filas miden lo mismo y quedan centradas bajo el título */
.opts .item .t{white-space:nowrap}                                 /* ningún texto de las opciones se parte en dos renglones */
#vopts .item.row .val,#gopts .item.row .val{flex:none;min-width:var(--vw,13cqw);margin-left:.8cqw;text-align:right}
/* Vídeo: dos columnas separadas, con las medidas exactas de la captura de referencia: los nombres arrancan todos en la "P" de "Pantalla completa" (borde izquierdo del bloque) y los estados terminan todos en la "s" final de "Sin bordes" (borde derecho del bloque) */
#vopts .item{}                 /* todas las opciones de Vídeo (con y sin estado) del mismo tamaño */
#vopts .item.row{width:var(--rw,45.5cqw);min-width:0}
#vopts .item.row .tw{flex:1;width:auto;min-width:0;text-align:left}
#vopts .item.row .val{flex:none;min-width:0;margin-left:1.2cqw;text-align:right}
/* Botón "Aplicar" al lado de Resolución */
.apply{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:1.6cqw;padding:.5cqw 1.5cqw;border:.12cqw solid rgba(244,241,234,.55);border-radius:.4cqw;background:rgba(0,0,0,.3);font-size:1.45cqw;line-height:1;letter-spacing:.06em;white-space:nowrap;cursor:pointer;opacity:.45;text-shadow:0 0 1cqw rgba(255,255,255,.55);transition:opacity .15s,box-shadow .15s,background .15s}
.apply.ready{opacity:1;box-shadow:0 0 1.1cqw rgba(255,255,255,.45)}
.apply:hover{background:rgba(255,255,255,.16)}
/* Botón "Aplicar" como en el port: aparece solo en la fila seleccionada (Resolución o Pantalla completa) */
.apply{display:none;opacity:.9;font-family:'Perpetua','Cormorant Garamond','EB Garamond',Georgia,serif;font-size:1.5cqw;letter-spacing:.02em;left:100%;margin-left:1.7cqw;box-sizing:border-box;width:6.51cqw;height:2.5cqw;padding:0;transition:none;border:.1cqw solid rgba(244,241,234,.95);border-radius:.3cqw;background:rgba(0,0,0,.35);text-shadow:none}
.item.sel .apply.ready{display:flex;align-items:center;justify-content:center}   /* solo aparece cuando hay un cambio pendiente, de golpe (sin fundido) */
.apply.ready{opacity:1;box-shadow:0 0 1.1cqw rgba(255,255,255,.5)}
html.bars,body.bars,html.ext,body.ext{background:#000}   /* barras negras alrededor del 16:9 en pantalla completa */
/* Sin bordes: el fondo y las partículas salen del marco 16:9 hasta el límite de la pantalla */
.stage.ext{overflow:visible}
.stage.ext::before{left:calc(var(--ex,0px)*-1);right:calc(var(--ex,0px)*-1);top:calc(var(--ey,0px)*-1);height:calc(150% + 2*var(--ey,0px));background-size:calc(100% - 2*var(--ex,0px)) calc(100% - 2*var(--ey,0px));background-position:var(--ex,0px) var(--ey,0px);transform-origin:50% calc(var(--ey,0px) + .36*(100% - 2*var(--ey,0px)))}   /* el brillo queda exactamente donde estaba; solo se agranda el área negra alrededor */
.item .desc{position:absolute;left:3.7cqw;top:100%;margin-top:.8cqh;white-space:nowrap;font-family:'Perpetua','Cormorant Garamond','EB Garamond',Georgia,serif;font-size:1.25cqw;line-height:1;letter-spacing:.01em;font-weight:400;opacity:0;pointer-events:none;transition:opacity .22s ease-out}
.item.sel .desc{opacity:1}
.stage.rst .item.sel .t{animation:rstTxt var(--fx) linear}
.stage.rst .item.sel .g::before{animation:glowOuter var(--fx) linear forwards}
.stage.rst .item.sel .g::after{animation:glowInner var(--fx) linear forwards}
@keyframes rstTxt{0%{filter:brightness(1)}8%{filter:brightness(2.1)}18%{filter:brightness(1.65)}30%{filter:brightness(1.3)}45%{filter:brightness(1.1)}62.5%,100%{filter:brightness(1)}}
</style>

    <div class="onav" id="greset"></div>
    <div class="onav" id="gback"></div>
  </div>
  <div class="opts" id="aopts">
    <div class="otitle" id="atitle"></div>
    <img class="orn" id="aorn" alt="">
    <div class="onav" id="amenu"></div>
    <div class="onav" id="areset"></div>
    <div class="onav" id="aback"></div>
  </div>
  <div class="opts" id="qopts">
    <div class="otitle" id="qtitle"></div>
    <img class="orn" id="qorn" alt="">
    <div class="onav" id="qmenu"></div>
  </div>
  <div class="opts" id="vopts">
    <div class="otitle" id="vtitle"></div>
    <img class="orn" id="vorn" alt="">
    <div class="onav" id="vmenu"></div>
    <div class="onav" id="vreset"></div>

  els=videoEls;videoVal[0]=resApplied;videoVal[1]=fullApplied;showVideo();fitVideo();placeVideo();setSel(0);drawOrn(vorn);
  setTimeout(function(){busy=false;},350);
}
function closeVideo(){
  fadeSwap(vopts,optsEl,function(){els=optEls;setSel(2);drawOrn(orn);});
}
var st=document.getElementById("stage");
var types=[[18,.12,.2,.9,0,6,11,.5],[16,.2,.34,.85,0,8,14,.8],[10,.35,.5,.8,0,10,16,1.1],[8,.55,.8,.75,0,12,19,1.7]];
function spark(t,lx,a,by,strip){
  var p=document.createElement("div");p.className="p"+(by!==undefined?" x":"");
  p.dataset.lx=lx;p.dataset.d=a.d;p.dataset.r=a.r;p.style.cssText="width:"+a.s+"cqw;height:"+a.s+"cqw;left:"+lx+"%;"+(by?"bottom:calc(-1% - "+by+"px);":"")+"--r:"+(by?"calc("+a.r+"cqh + "+by+"px)":a.r+"cqh")+";--o:"+(t[3]*(0.8+Math.random()*0.3))+";--dx:"+((Math.random()-.4)*2.4)+"cqw;box-shadow:0 0 "+t[7]+"cqw "+(t[7]/3)+"cqw rgba(70,255,110,.7);animation-delay:"+(-Math.random()*20)+"s;animation-duration:"+a.d+"s"+(strip?";animation-name:flx":"")+";";
  st.appendChild(p);
}
function rnd(t){return {s:t[1]+Math.random()*(t[2]-t[1]),d:t[5]+Math.random()*(t[6]-t[5]),r:25+Math.pow(Math.random(),1.2)*90};}
// Las partículas viven en un "mundo" tan grande como la pantalla (aunque el escenario sea 16:9): nacen debajo del borde de la pantalla y suben.
// Desactivada / Activada / Sin bordes solo cambian cuánto se deja ver (el 16:9, el 16:9 con barras negras, o todo), así que cambiar de modo no las mueve.
var worldKey="";
function worldParticles(pex,E,SH){
  var key=Math.round(pex*10)+"|"+Math.round(E);
  if(key===worldKey)return;worldKey=key;
  Array.prototype.forEach.call(stg.querySelectorAll(".p.x"),function(p){p.remove();});
  var eyc=E/(SH/100);
  if(pex>.5)types.forEach(function(t){           // costados: misma densidad que el resto
    var side=Math.floor(t[0]/4),n=side*pex/27,k;
    n=Math.floor(n)+(Math.random()<n%1?1:0);
    for(k=0;k<n;k++){var a=rnd(t);spark(t,-pex+Math.random()*pex,a,0);spark(t,100+Math.random()*pex,a,0);}
  });
  Array.prototype.forEach.call(stg.querySelectorAll(".p"),function(p){   // mismo ritmo de subida aunque el recorrido sea un poco más largo
    var d=+p.dataset.d,r=+p.dataset.r;if(d&&r)p.style.animationDuration=(d*(r+eyc)/r)+"s";
  });
}
types.forEach(function(t){
  var side=Math.floor(t[0]/4);
  for(var k=0;k<side;k++){var a=rnd(t);              // izquierda y derecha comparten tamaño y velocidad
    spark(t,3+Math.random()*27,a);
    spark(t,70+Math.random()*27,a);}
  for(var k=0;k<t[0]-2*side;k++){spark(t,30+Math.random()*40,rnd(t));}
});

var intro=document.getElementById("intro");
intro.addEventListener("animationend",function(e){if(e.animationName==="introOut"){intro.remove();intro=null;}});


// ---- "Salir del juego": confirmación con el ornamento; "Sí" guarda todo y cierra la página ----
var qopts=document.getElementById("qopts"),qorn=document.getElementById("qorn"),qmenu=document.getElementById("qmenu"),quitEls=[];
qorn.src=orn.src;
document.getElementById("qtitle").textContent="¿Salir del juego?";
mkItem("Sí",0,quitEls,qmenu);mkItem("No",1,quitEls,qmenu);
bindNav(qmenu);
function openQuit(){
  stg.classList.add("opt");
  els=quitEls;qopts.classList.add("show");
  setSel(1);drawOrn(qorn);                                         // empieza marcado "No"
  setTimeout(function(){busy=false;},350);
}
function closeQuit(){
  qopts.classList.remove("show");
  stg.classList.remove("opt");stg.classList.add("back");
  els=mainEls;setSel(4);                                           // vuelve con "Salir del juego" marcado
  setTimeout(function(){stg.classList.remove("back");busy=false;},520);
}
function doQuit(){
  saveSettings();
  try{if(actx&&mgain){var t=actx.currentTime;mgain.gain.cancelScheduledValues(t);mgain.gain.setValueAtTime(mgain.gain.value,t);mgain.gain.linearRampToValueAtTime(0,t+.6);}}catch(e){}
  var b=document.createElement("div");b.id="bye";document.body.appendChild(b);
  requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add("on");});});
  setTimeout(function(){
    try{var on=document.fullscreenElement||document.webkitFullscreenElement;if(on)(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}
    try{window.close();}catch(e){}
    setTimeout(function(){try{location.replace("about:blank");}catch(e){}},250);   // si el navegador no deja cerrar la pestaña, queda la página en blanco
  },800);
}
// ---- se guardan los cambios del jugador (juego, audio, vídeo y pantalla completa) y vuelven al abrir la página ----
var SKEY="hkbv-settings-v1";
function saveSettings(){
  try{
    var v=videoVal.slice(0,videoOpts.length);v[1]=fullApplied;
    localStorage.setItem(SKEY,JSON.stringify({g:gameVal,a:[volG,volS,volM],v:v,f:fullApplied}));
  }catch(e){}
}
function loadSettings(){
  var o=null;
  try{o=JSON.parse(localStorage.getItem(SKEY)||"null");}catch(e){}
  if(!o)return;
  function ok(x,n){return typeof x==="number"&&x>=0&&x<n&&x===Math.floor(x);}
  if(o.g&&o.g.length===gameVal.length)o.g.forEach(function(x,i){if(ok(x,gameOpts[i].v.length))gameVal[i]=x;});
  if(o.a&&o.a.length===3){var q=o.a.map(function(x){return typeof x==="number"?Math.max(0,Math.min(10,Math.round(x))):10;});volG=q[0];volS=q[1];volM=q[2];}
  if(o.v&&o.v.length===videoOpts.length)o.v.forEach(function(x,i){if(videoOpts[i].v&&ok(x,videoOpts[i].v.length))videoVal[i]=x;});
  var f=ok(o.f,3)?o.f:0;
  videoVal[0]=resApplied;fullApplied=f;videoVal[1]=f;
  showGame();showAudio();showVideo();applyMusicVol();layoutStage();
  if(f>0){                                                         // el navegador solo deja entrar en pantalla completa tras un toque o tecla: se hace con el primero
    var evs=["pointerup","touchend","click","mouseup","keydown"];   // en pantallas táctiles el navegador solo acepta pantalla completa al levantar el dedo (pointerdown no cuenta)
    var arm=function(){
      var on=document.fullscreenElement||document.webkitFullscreenElement;
      if(fullApplied<=0||on){evs.forEach(function(n){document.removeEventListener(n,arm,true);});return;}
      setFull(fullApplied);
    };
    evs.forEach(function(n){document.addEventListener(n,arm,true);});
    try{setFull(f);}catch(e){}                                       // por si el navegador ya lo permite sin tocar
  }
}
loadSettings();layoutStage();                              // arma el mundo de partículas ya con las partículas creadas
setInterval(saveSettings,1000);
addEventListener("pagehide",saveSettings);
document.addEventListener("visibilitychange",function(){if(document.hidden)saveSettings();});
var MUSIC_B64_FILE="./assets/menu-music.mp3";
// ---- música del menú: empieza a sonar cuando aparece el menú; bucle sin cortes (Web Audio) ----
var actx=null,mbuf=null,musicWant=false,musicOn=false,resTried=false;
try{
  actx=new (window.AudioContext||window.webkitAudioContext)();
  fetch(MUSIC_B64_FILE).then(function(r){if(!r.ok)throw new Error("No se pudo cargar la música");return r.arrayBuffer();})
    .then(function(data){return actx.decodeAudioData(data);})
    .then(function(b){mbuf=b;musicTry();})
    .catch(function(e){console.warn("No se pudo cargar la música del menú:",e);});
}catch(e){actx=null;}
function musicTry(){
  if(!actx||!musicWant||musicOn||!mbuf)return;
  if(actx.state!=="running"){if(!resTried){resTried=true;actx.resume().then(musicTry,function(){});}return;}
  var s=actx.createBufferSource();s.buffer=mbuf;s.loop=true;
  var g=actx.createGain();g.gain.setValueAtTime(0,actx.currentTime);g.gain.linearRampToValueAtTime(.9*vM(),actx.currentTime+.8);mgain=g;
  s.connect(g);g.connect(actx.destination);s.start(0);musicOn=true;
}
function musicStart(){musicWant=true;musicTry();}
["pointerdown","touchstart","keydown","click"].forEach(function(ev){document.addEventListener(ev,function(){resTried=false;if(actx&&actx.state==="suspended")actx.resume().then(musicTry,function(){});else musicTry();},{passive:true});});
document.addEventListener("visibilitychange",function(){if(!actx||!musicOn)return;if(document.hidden)actx.suspend();else actx.resume();});
(function(){var i=document.getElementById("intro");if(i)i.addEventListener("animationstart",function(e){if(e.animationName==="introOut")musicStart();});setTimeout(musicStart,18000);})();
// ---- sonido al cambiar de opción (flechitas del menú) ----
var SFX_B64_FILE="./assets/move-sound.wav";
var sfxbuf=null,sfxLast=-1e9;
try{
  if(actx){fetch(SFX_B64_FILE).then(function(r){if(!r.ok)throw new Error("No se pudo cargar el sonido de navegación");return r.arrayBuffer();})
    .then(function(data){return actx.decodeAudioData(data);}).then(function(b){sfxbuf=b;})
    .catch(function(e){console.warn("No se pudo cargar el sonido de navegación:",e);});}
}catch(e){}
function sfxShot(){var s=actx.createBufferSource();s.buffer=sfxbuf;var g=actx.createGain();g.gain.value=.25*vS();s.connect(g);g.connect(actx.destination);s.start(0);}
function sfxPlay(fast){
  if(!actx||!sfxbuf||document.getElementById("intro"))return;var now=performance.now();if(now-sfxLast<(fast?15:60))return;sfxLast=now;
  if(actx.state==="running"){sfxShot();return;}
  var act=navigator.userActivation?navigator.userActivation.isActive:true;
  if(act)actx.resume().then(function(){if(actx.state==="running")sfxShot();},function(){});
}
// ---- sonido al elegir (confirmar) una opción ----
var CFX_B64_FILE="./assets/confirm-sound.wav";
var cfxbuf=null;
try{
  if(actx){fetch(CFX_B64_FILE).then(function(r){if(!r.ok)throw new Error("No se pudo cargar el sonido de confirmación");return r.arrayBuffer();})
    .then(function(data){return actx.decodeAudioData(data);}).then(function(b){cfxbuf=b;})
    .catch(function(e){console.warn("No se pudo cargar el sonido de confirmación:",e);});}
}catch(e){}
function cfxShot(){var s=actx.createBufferSource();s.buffer=cfxbuf;var g=actx.createGain();g.gain.value=.25*vS();s.connect(g);g.connect(actx.destination);s.start(0);}
function cfxPlay(){
  if(!actx||!cfxbuf)return;
  if(actx.state==="running"){cfxShot();return;}
  actx.resume().then(function(){if(actx.state==="running")cfxShot();},function(){});
}
</script>
